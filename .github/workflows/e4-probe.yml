name: E4

on:
  push:
    branches: [main]

jobs:
  e4:
    runs-on: ubuntu-latest
    steps:
      - name: Fake release file
        run: |
          mkdir -p app/build/outputs/apk/release
          echo x > app/build/outputs/apk/release/test.apk

      - name: Create GitHub Release with signed APKs
        uses: softprops/action-gh-release@v2
        with:
          name: Med RX probe ${{ github.run_id }}
          body: |
            Probe release to validate the release action.

            **Med RX is a community fork of [Med by FeDeveloper95](https://github.com/FeDeveloper95/Med) (Apache 2.0), maintained by nukirk.**

            This is a temporary probe release and will be deleted.
          files: |
            app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: true
