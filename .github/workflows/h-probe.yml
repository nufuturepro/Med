name: ReleaseH

on:
  push:
    branches: [main]

permissions:
  contents: write
  discussions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode signing keystore
        run: echo "skipped for probe"

      - name: Assemble signed release APKs
        run: echo "assemble"

      - name: Extract version info
        id: version
        run: |
          echo "name=test" >> "$GITHUB_OUTPUT"
          echo "code=99" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release with signed APKs
        uses: softprops/action-gh-release@v2
        with:
          name: Med RX ${{ steps.version.outputs.name }}
          body: |
            Med RX ${{ steps.version.outputs.name }} (versionCode ${{ steps.version.outputs.code }})

            **Med RX is a community fork of [Med by FeDeveloper95](https://github.com/FeDeveloper95/Med) (Apache 2.0), maintained by nukirk.**

            This is a temporary probe and will be deleted.
          files: |
            app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: true
