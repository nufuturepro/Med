name: ReleaseI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Env with one secrets expression
        env:
          KEY_STORE_FILE: ${{ secrets.KEY_STORE_FILE }}
        run: echo "probe I"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: Probe I
          body: Temporary probe.
          files: app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: false
