name: ReleaseG

on:
  push:
    branches: [main]

permissions:
  contents: write
  discussions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode signing keystore
        env:
          KEY_STORE_FILE: ${{ secrets.KEY_STORE_FILE }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: echo "decode"

      - name: Assemble signed release APKs
        env:
          KEY_STORE_FILE: ${{ runner.temp }}/medrx-release.jks
        run: echo "assemble"

      - name: Create GitHub Release with signed APKs
        uses: softprops/action-gh-release@v2
        with:
          name: Med RX
          body: |
            Med RX probe.

            **Med RX is a community fork of [Med by FeDeveloper95](https://github.com/FeDeveloper95/Med) (Apache 2.0), maintained by nukirk.**

            This is a temporary probe and will be deleted.
          files: |
            app/build/outputs/apk/release/*.apk
            wear/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: true
